# GWSA Integration Test Configuration
#
# Maps gwsa account names (as shown by `gwsa-admin accounts list`)
# to per-account test settings. Tests requiring real emails are
# skipped if the active account is not configured here.

accounts:
  # Example: a personal Gmail account that receives USPS Informed
  # Delivery digests. Adjust the search query to a routine,
  # low-risk pattern that exists in your account.
  personal:
    search_query: 'subject:"Your Daily Digest" from:"USPS Informed Delivery"'
    test_label: "Test"
    min_results: 2
    days_range: 60
